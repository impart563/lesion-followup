name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moonbit:
    name: acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: verification/临床 followup
    env:
      MOONBIT_INSTALL_VERSION: "0.10.14+7d59c7ec9"
      MOON_WORK: "off"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: verification/临床 followup
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install MoonBit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Refresh package registry
        run: moon update
      - name: Run acceptance checks
        run: |
          moon version --all
          python scripts/acceptance.py --record _build/platform-acceptance.json
      - name: Preserve platform evidence and browser entry
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          if-no-files-found: error
          path: |
            verification/临床 followup/_build/platform-acceptance.json
            verification/临床 followup/_build/browser/*.html
            verification/临床 followup/_build/browser/*.js
            verification/临床 followup/_build/browser/*.mjs
            verification/临床 followup/_build/browser/*.css
            verification/临床 followup/_build/publish/*.zip
